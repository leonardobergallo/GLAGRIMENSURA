<!-- Estado parcelario - Imagen profesional con documentacion catastral -->
<svg width="1200" height="800" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="estadoGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f3b5f;stop-opacity:1" />
      <stop offset="55%" style="stop-color:#2563eb;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#60a5fa;stop-opacity:1" />
    </linearGradient>
    <pattern id="parcelGrid" width="60" height="60" patternUnits="userSpaceOnUse">
      <path d="M 60 0 L 0 0 0 60" fill="none" stroke="white" stroke-width="0.7" opacity="0.11"/>
    </pattern>
  </defs>
  <rect width="1200" height="800" fill="url(#estadoGrad)"/>
  <rect width="1200" height="800" fill="url(#parcelGrid)"/>
  <g transform="translate(840, 160)" opacity="0.24">
    <rect x="0" y="0" width="190" height="250" rx="16" fill="white"/>
    <rect x="35" y="44" width="120" height="14" rx="7" fill="#0f3b5f"/>
    <rect x="35" y="86" width="120" height="14" rx="7" fill="#0f3b5f"/>
    <rect x="35" y="128" width="82" height="14" rx="7" fill="#0f3b5f"/>
    <path d="M38 188 L88 146 L146 192 L104 224 Z" fill="none" stroke="#0f3b5f" stroke-width="12"/>
  </g>
  <g transform="translate(110, 120)" opacity="0.2">
    <circle cx="70" cy="70" r="68" fill="none" stroke="white" stroke-width="4"/>
    <circle cx="70" cy="70" r="44" fill="none" stroke="white" stroke-width="3"/>
    <line x1="70" y1="0" x2="70" y2="140" stroke="white" stroke-width="3"/>
    <line x1="0" y1="70" x2="140" y2="70" stroke="white" stroke-width="3"/>
  </g>
  <text x="80" y="340" font-family="Arial, sans-serif" font-size="78" fill="white" font-weight="bold">Constitución de</text>
  <text x="80" y="430" font-family="Arial, sans-serif" font-size="78" fill="white" font-weight="bold">Estado Parcelario</text>
  <text x="80" y="510" font-family="Arial, sans-serif" font-size="42" fill="white" opacity="0.95">Documentación técnica catastral</text>
  <g transform="translate(80, 590)">
    <text font-family="Arial, sans-serif" font-size="27" fill="white" opacity="0.9">Escrituras • Ventas • Transferencias</text>
  </g>
</svg>
